name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Create Chrome ZIP
        run: pnpm zip

      - name: Save Chrome ZIP
        run: mv .output/*.zip /tmp/

      - name: Create Firefox ZIP
        run: pnpm zip:firefox

      - name: Collect all ZIPs
        run: |
          mkdir -p artifacts
          mv /tmp/*.zip artifacts/
          mv .output/*.zip artifacts/
          echo "Collected artifacts:"
          ls -la artifacts/

      - name: Upload artifacts for store submission
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-stores:
    needs: release
    runs-on: ubuntu-latest
    # Skip pre-releases (alpha/beta/rc)
    if: ${{ !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc') }}
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: .output/

      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la .output/

      - name: Submit to stores
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip \
            --edge-zip .output/*-chrome.zip
        env:
          # Firefox Add-ons
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          # Microsoft Edge Add-ons
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Chrome Web Store (handled in a separate step below)

      - name: Upload to Chrome Web Store (draft)
        # Only run once the CWS item exists and CHROME_* secrets are configured.
        if: >-
          ${{
            env.CHROME_EXTENSION_ID != '' &&
            env.CHROME_CLIENT_ID != '' &&
            env.CHROME_CLIENT_SECRET != '' &&
            env.CHROME_REFRESH_TOKEN != ''
          }}
        run: |
          pnpm wxt submit \
            --chrome-zip .output/*-chrome.zip \
            --chrome-skip-submit-review
