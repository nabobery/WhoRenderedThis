name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Create ZIP
        run: pnpm zip

      - name: Validate Chrome ZIP contents
        run: |
          ZIP="$(ls -1 .output/*-chrome.zip | head -n 1)"
          echo "Validating zip: $ZIP"
          unzip -l "$ZIP" | grep -q "manifest.json"
          unzip -l "$ZIP" | grep -q "icon/128.png"

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: .output/*.zip
          retention-days: 30
