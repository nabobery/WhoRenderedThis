name: Submit Dry Run

on:
  workflow_dispatch:
    inputs:
      stores:
        description: 'Which stores to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - firefox
          - edge
          - chrome

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Chrome ZIP
        run: pnpm zip

      - name: Save Chrome ZIP
        run: mv .output/*.zip /tmp/

      - name: Create Firefox ZIP
        run: pnpm zip:firefox

      - name: Collect all ZIPs
        run: mv /tmp/*.zip .output/

      - name: Dry run - Firefox
        if: ${{ inputs.stores == 'all' || inputs.stores == 'firefox' }}
        run: |
          pnpm wxt submit --dry-run \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Dry run - Edge
        if: ${{ inputs.stores == 'all' || inputs.stores == 'edge' }}
        run: |
          pnpm wxt submit --dry-run \
            --edge-zip .output/*-chrome.zip
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      - name: Dry run - Chrome
        # Only works after the CWS item exists and secrets are configured.
        if: >-
          ${{
            (inputs.stores == 'all' || inputs.stores == 'chrome') &&
            env.CHROME_EXTENSION_ID != '' &&
            env.CHROME_CLIENT_ID != '' &&
            env.CHROME_CLIENT_SECRET != '' &&
            env.CHROME_REFRESH_TOKEN != ''
          }}
        run: |
          pnpm wxt submit --dry-run \
            --chrome-zip .output/*-chrome.zip
